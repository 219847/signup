<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <h1>Create an Account</h1>

  <input id="email" type="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>

  <button id="signupBtn">Sign Up</button>

  <p id="message"></p>

<script>
  const SUPABASE_URL = "https://fjkvbkspjcvfdnlxajty.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_NZscoctqsHq6AInmQIDFdQ_gYvNed5d";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function signUp() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const msg = document.getElementById("message");

    const { data, error } = await client.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: "https://your-domain.com/welcome"
      }
    });

    if (error) {
      msg.textContent = "Error: " + error.message;
      msg.style.color = "red";
      return;
    }

    // ⭐ STEP 2: Create balance row for new user
    await client.from("user_balance").insert({
  user_id: data.user.id,
  balance: 1000.0
});


    msg.textContent = "You have signed up successfully.";
    msg.style.color = "green";
  }

  document.getElementById("signupBtn").addEventListener("click", signUp);
</script>

</body>
</html>
